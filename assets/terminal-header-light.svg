<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Jorge Filipe Mendes terminal profile header</title>
  <desc id="description">Animated terminal introducing Jorge and his engineering focus.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f6f8fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2328" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect x="18" y="18" width="1164" height="264" rx="18" fill="url(#shell)" stroke="#d0d7de" stroke-width="2" filter="url(#shadow)" />
  <path d="M18 72h1164" stroke="#d0d7de" stroke-width="2" />
  <circle cx="54" cy="45" r="8" fill="#ff5f57" />
  <circle cx="82" cy="45" r="8" fill="#febc2e" />
  <circle cx="110" cy="45" r="8" fill="#28a745" />
  <text x="600" y="51" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">jorge@github: ~</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="60" y="125" fill="#1a7f37" font-size="25">$</text>

    <g>
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.27;0.32;0.62;0.67;0.95;1" dur="9s" repeatCount="indefinite" />
      <text x="88" y="125" fill="#1f2328" font-size="25">whoami</text>
      <text x="60" y="181" fill="#1f2328" font-size="38" font-weight="700">Jorge Filipe Mendes</text>
      <text x="60" y="225" fill="#57606a" font-size="22">MSc Computer Science and Engineering @ Instituto Superior Técnico</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.27;0.32;0.62;0.67;0.95;1" dur="9s" repeatCount="indefinite" />
      <text x="88" y="125" fill="#1f2328" font-size="25">focus</text>
      <text x="60" y="181" fill="#1f2328" font-size="34" font-weight="700">systems · security · applied AI</text>
      <text x="60" y="225" fill="#57606a" font-size="22">dependable by design, reproducible by default</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.27;0.32;0.62;0.67;0.95;1" dur="9s" repeatCount="indefinite" />
      <text x="88" y="125" fill="#1f2328" font-size="25">build --reliable --reproducible</text>
      <text x="60" y="181" fill="#1a7f37" font-size="34" font-weight="700">status: ready</text>
      <rect x="60" y="211" width="15" height="27" rx="2" fill="#1a7f37">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
